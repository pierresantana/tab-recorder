<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 220px; margin: 0; padding: 14px; font: 14px system-ui, sans-serif; }
  button { width: 100%; padding: 10px; font-size: 14px; border: 0; border-radius: 6px; cursor: pointer; color: #fff; background: #d32f2f; }
  button.stop { background: #333; }
  #micRow { display: block; margin-top: 10px; font-size: 12px; color: #333; }
  #status { margin-top: 10px; font-size: 12px; color: #555; min-height: 1.4em; }
</style>
</head>
<body>
  <button id="toggle">Start recording</button>
  <label id="micRow"><input type="checkbox" id="mic" checked> Record microphone</label>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
